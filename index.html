<!DOCTYPE html>
<html>
<head>
<title>Martinez Equipo Creativo</title>
<style>

body{
font-family: Arial;
text-align:center;
padding:40px;
background:#0f172a;
color:white;
}

input{
padding:10px;
width:300px;
}

button{
padding:10px;
background:#f59e0b;
border:none;
color:white;
cursor:pointer;
}

#respuesta{
margin-top:20px;
font-size:18px;
}

</style>
</head>

<body>

<h1>Asesor IA de Marketing</h1>
<p>Haz una pregunta sobre tu negocio</p>

<input id="pregunta" placeholder="Escribe tu pregunta">

<button onclick="preguntar()">Enviar</button>

<p id="respuesta"></p>

<script>

async function preguntar(){

const pregunta = document.getElementById("pregunta").value;

const response = await fetch(
"AQ.Ab8RN6KN2GRRpMX_uF27Bu0giqgSakeOYEGgJPH6TGeRe2JBVw",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
contents:[
{
parts:[
{text: pregunta}
]
}
]
})
});

const data = await response.json();

document.getElementById("respuesta").innerText =
data.candidates[0].content.parts[0].text;

}

</script>

</body>
</html>
