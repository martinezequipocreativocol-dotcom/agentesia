<!DOCTYPE html>
<html>
<head>
<title>Martinez Equipo Creativo - IA</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
padding:40px;
}

select,input,button{
padding:10px;
margin:10px;
}

#chat{
margin-top:30px;
max-width:600px;
margin-left:auto;
margin-right:auto;
text-align:left;
}

.mensajeUsuario{
color:#fbbf24;
}

.mensajeIA{
color:#38bdf8;
}

</style>
</head>

<body>

<h1>Agentes IA - Martinez Equipo Creativo</h1>

<select id="agente">
<option value="marketing">Estratega de Marketing</option>
<option value="diagnostico">Diagnóstico de Negocio</option>
<option value="ventas">Asesor Comercial</option>
</select>

<br>

<input id="pregunta" placeholder="Escribe tu pregunta">

<button onclick="preguntar()">Enviar</button>

<div id="chat"></div>

<script>

const prompts = {

marketing:`Eres un estratega digital experto de Martinez Equipo Creativo.
Ayudas a emprendedores a mejorar su marketing digital.`,

diagnostico:`Eres consultor de negocios de Martinez Equipo Creativo.
Analiza problemas de marketing y ventas.`,

ventas:`Eres asesor comercial de Martinez Equipo Creativo.
Tu objetivo es convertir visitantes en clientes.`

};

async function preguntar(){

const preguntaUsuario = document.getElementById("pregunta").value;

const agente = document.getElementById("agente").value;

const promptCompleto = prompts[agente] + "\nPregunta del usuario: " + preguntaUsuario;

const chat = document.getElementById("chat");

chat.innerHTML += "<p class='mensajeUsuario'><b>Usuario:</b> "+preguntaUsuario+"</p>";

const response = await fetch(
"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AQ.Ab8RN6KN2GRRpMX_uF27Bu0giqgSakeOYEGgJPH6TGeRe2JBVw",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
contents:[
{
parts:[
{text: promptCompleto}
]
}
]
})
});

const data = await response.json();

let respuesta = "No se pudo obtener respuesta.";

if(data.candidates && data.candidates.length > 0){
respuesta = data.candidates[0].content.parts[0].text;
}


chat.innerHTML += "<p class='mensajeIA'><b>IA:</b> "+respuesta+"</p>";

}

</script>

</body>
</html>
